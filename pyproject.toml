[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Do not add spaces around the '=' sign for any of the fields
# preceeded by a marker comment as it affects the publish workflow.
#replace_package_name_marker
name="autometrics-ai"
#replace_package_version_marker
version="0.0.6"
description = "Automatically generate evaluators that approximate human judgements"
readme = "README.md"
authors = [{ name = "Michael Ryan", email = "michaeljryan@stanford.edu" }]
license = { text = "MIT License" }
requires-python = ">=3.9"
keywords = [
    "evaluation",
    "metrics",
    "llm",
    "llm-as-a-judge",
    "nlp",
    "human-feedback",
    "reward-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# project dependencies function similarly to requirements.txt,
# `pip install .` will pull from pyproject.toml dependencies
dependencies = [
    "dspy",
    "diskcache",
    "platformdirs",
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "transformers",
    "nltk",
    "sacrebleu",
    "scikit-learn",
    "Levenshtein",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autometrics", "autometrics.*"]
exclude = ["tests", "tests.*", "autometrics.test", "autometrics.test.*"]

[tool.setuptools.package-data]
autometrics = [
    "metrics/documentation/*.md",
    "metrics/documentation/prompt.txt",
    "util/*.js",
]

[tool.setuptools.exclude-package-data]
autometrics = ["**/.DS_Store", "**/TODO.txt"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0,<1.0.0"]

# Metric-specific optional clusters
fasttext = [
    "fasttext",
    "requests",
    "huggingface_hub"
]

lens = [
    "lens-metric"
]

parascore = [
    "parascore==1.0.5"
]

bert-score = [
    "bert-score==0.3.13"
]

bleurt = [
    "bleurt-pytorch"
]

moverscore = [
    "pyemd"
]

rouge = [
    "rouge-score"
]

meteor = [
    "beautifulsoup4"
]

infolm = [
    "torchmetrics"
]

mauve = [
    "evaluate",
    "mauve-text"
]

spacy = [
    "spacy"
]

hf-evaluate = [
    "evaluate"
]

reward-models = [
    "accelerate",
    "huggingface_hub"
]

readability = [
    "textstat"
]

# System/GPU accelerators (optional)
gpu = [
    "flash-attn",
    "pynvml",
    "nvidia-ml-py"
]

[project.urls]
homepage = "https://github.com/SALT-NLP/autometrics"
repository = "https://github.com/SALT-NLP/autometrics"

[tool.coverage.run]
branch = true
omit = [
    "*/__init__.py",
    "*/test_*.py",
    "*/tests/*.py",
    "*/conftest.py",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.venv/*",
    "*/.virtualenv/*",
    "*/env/*",
    "*/.env/*",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "logger",
    "try",
    "except",
    "^\\s*self\\.\\w+(:\\s*[^=]+)?\\s*=.*$",
    "continue",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Select a minimal set of rules
select = [
    "F", # Pyflakes
    "E", # Pycodestyle
    "TID252", # Absolute imports

]
ignore = [
    "E501", # Line too long

]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
docstring-code-format = false
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/{tests,testing,docs}/*" = ["ALL"]
"**__init__.py" = ["ALL"]